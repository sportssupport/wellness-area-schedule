:root{
  --black:#000;--white:#fff;--gray:#868785;--orange:#f4bd00;--cream:#efcfa9;--pink:#ef5b84;
  --ink-soft:#3d3e3c;--line:rgba(0,0,0,.14);
  --body:'Frutiger LightCn',"Arial Narrow",sans-serif;
  --head:'Platelet',"Arial Narrow",sans-serif;
  --thin:'Platelet Thin','Platelet',"Arial Narrow",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--cream);color:var(--black);font-family:var(--body);-webkit-text-size-adjust:100%}
a{color:inherit;text-decoration:none}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--cream);display:flex;flex-direction:column}
header.top{background:var(--black);color:var(--white);padding:calc(20px + env(safe-area-inset-top,0px)) 24px 26px;display:flex;flex-direction:column}
.brand{display:flex;align-items:baseline;gap:12px}
.brand .logo{font-size:21px;letter-spacing:2px}
.brand .claim{font-family:var(--body);font-weight:300;font-size:13px;letter-spacing:3px;color:rgba(255,255,255,.72)}
.h-thin{font-family:var(--thin);letter-spacing:7px;line-height:1}
.h-bold{font-family:var(--head);font-weight:600;letter-spacing:1px;line-height:1.05}
.bar{width:48px;height:4px;background:var(--orange);margin-top:18px}
.datetime{margin-top:18px;font-size:15px;letter-spacing:3px;color:rgba(255,255,255,.66)}
.back{font-size:15px;letter-spacing:3px;color:rgba(255,255,255,.72);padding:6px 0;align-self:flex-start}
.tabs{margin-top:18px;display:grid;grid-template-columns:1fr 1fr;border:1px solid rgba(255,255,255,.35);border-radius:10px;overflow:hidden}
.tabs a{text-align:center;padding:13px 0;font-family:var(--body);font-weight:300;font-size:16px;letter-spacing:4px;color:var(--white)}
.tabs a.on{background:var(--cream);color:var(--black)}
main{padding:20px 20px 32px;display:flex;flex-direction:column;gap:14px}

/* Kacheln */

.tl{display:flex;flex-direction:column;gap:8px}
.cap{font-size:13px;letter-spacing:2px;color:rgba(255,255,255,.66);text-transform:uppercase}

.big.pink{color:var(--pink)}

.meta .time{font-family:var(--body);font-weight:300;font-size:21px;letter-spacing:1px;color:var(--white)}
.meta span{display:flex;align-items:center;gap:5px}
.foot{border-top:1px solid rgba(255,255,255,.18);padding-top:12px;font-size:14px;letter-spacing:2px;color:rgba(255,255,255,.66);text-transform:uppercase}

/* Listen */
.kicker{font-size:14px;letter-spacing:4px;color:#4a4b49;text-transform:uppercase}
.title{font-family:var(--body);font-weight:300;font-size:19px;letter-spacing:5px}
.row{display:flex;align-items:center;gap:12px;padding:12px 10px;border-bottom:1px solid var(--line)}
.row.past{opacity:.45}
.row.active{background:var(--white);border-bottom-color:transparent;border-radius:10px}
.row .ico{width:40px;height:34px;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.row .t{width:112px;flex:0 0 auto;font-family:var(--body);font-weight:300;font-size:18px;letter-spacing:.5px}
.row .a{flex:1 1 auto;font-size:19px}
.tag{background:var(--orange);color:var(--black);font-size:12px;letter-spacing:2px;padding:4px 8px;border-radius:6px;flex:0 0 auto}
.legend{display:flex;flex-direction:column;gap:10px;padding:14px 16px;border:1px solid rgba(0,0,0,.18);border-radius:10px}
.legend .keys{display:flex;gap:18px;flex-wrap:wrap;font-size:15px;color:var(--ink-soft)}
.legend .keys span{display:flex;align-items:center;gap:7px}
.dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.legend hr{border:0;height:1px;background:var(--line)}
.legend .spec{display:flex;align-items:center;gap:14px;font-size:16px}
.legend .spec b{width:86px;font-family:var(--body);font-weight:300;font-size:14px;letter-spacing:3px;color:#4a4b49}
.legend .spec span{display:flex;align-items:center;gap:5px}
.day{display:flex;flex-direction:column;padding:14px 16px 10px;border-radius:10px;background:rgba(255,255,255,.35)}
.day.today{background:var(--white)}
.day-head{display:flex;align-items:center;justify-content:space-between;padding-bottom:8px;border-bottom:1px solid rgba(0,0,0,.18)}
.day-head span:first-child{font-family:var(--body);font-weight:300;font-size:17px;letter-spacing:4px}
.drow{display:flex;align-items:center;gap:12px;padding:7px 0}
.drow .ico{width:34px;height:28px;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.drow .t{width:104px;flex:0 0 auto;font-family:var(--body);font-weight:300;font-size:16px;letter-spacing:.5px;color:#3d3e3c}
.drow .a{font-size:17px}
.empty{padding:28px 10px;text-align:center;font-size:18px;color:var(--ink-soft)}
.note{padding:40px 24px;text-align:center;font-size:18px;letter-spacing:1px;color:var(--ink-soft)}
:root{--cream:#ebebeb}
header.top{background:#fff;color:#000;border-bottom:1px solid rgba(0,0,0,.08)}
.brand .claim{color:#555} .datetime{color:#555} .back{color:#555}
.tabs{border-color:#2b2b2b} .tabs a{color:#2b2b2b} .tabs a.on{background:#2b2b2b;color:#fff}
.tile{background:#fff;color:#000;border:1.5px solid #2b2b2b}
.cap,.hcap{color:#555} .foot{border-top-color:rgba(0,0,0,.14);color:#555}
.meta{color:#333} .meta .time{color:#000}
.legend{background:#fff;border-color:rgba(0,0,0,.14)}
.day{background:#fff} .day.today{box-shadow:inset 0 0 0 1.5px #2b2b2b}
.row.active{box-shadow:inset 0 0 0 1.5px #2b2b2b}
header.top{border-bottom:0;box-shadow:0 6px 18px rgba(0,0,0,.07);position:relative;z-index:2}
.tile{border:1px solid rgba(0,0,0,.07);box-shadow:0 1px 2px rgba(0,0,0,.06), 0 6px 18px rgba(0,0,0,.06);border-radius:16px}
.tabs{border-radius:10px}
.legend{border:1px solid rgba(0,0,0,.07);box-shadow:0 1px 2px rgba(0,0,0,.06), 0 6px 18px rgba(0,0,0,.06);border-radius:14px}
.day{border-radius:14px;box-shadow:0 1px 2px rgba(0,0,0,.06), 0 6px 18px rgba(0,0,0,.06);border:1px solid rgba(0,0,0,.05)}
.day.today{box-shadow:inset 0 0 0 2px #f4bd00, 0 1px 2px rgba(0,0,0,.06), 0 6px 18px rgba(0,0,0,.06)}
.row{border-radius:12px;border-bottom:0;margin-bottom:6px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.06), 0 6px 18px rgba(0,0,0,.06)}
.row.active{box-shadow:inset 0 0 0 2px #f4bd00, 0 1px 2px rgba(0,0,0,.06), 0 6px 18px rgba(0,0,0,.06)}
.row.clean{background:repeating-linear-gradient(135deg,#f7f7f7 0 8px,#d4d4d4 8px 10.5px);box-shadow:none}
.row.clean .t,.row.clean .a{color:#555}
.row.past{opacity:.5}
.tile-label{color:#000 !important;text-decoration:underline;text-decoration-color:#f4bd00;text-decoration-thickness:.16em;text-underline-offset:.22em}

.sk{background:linear-gradient(90deg,#e4e4e4 25%,#f1f1f1 50%,#e4e4e4 75%);background-size:200% 100%;animation:skm 1.3s ease-in-out infinite;border-radius:8px;flex:0 0 auto}
@keyframes skm{0%{background-position:200% 0}100%{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}
.closedcard{background:#fff;border-radius:14px;padding:26px 20px;text-align:center;box-shadow:0 1px 2px rgba(0,0,0,.06),0 6px 18px rgba(0,0,0,.06)}
.cc1{font-size:20px;letter-spacing:2px;text-transform:uppercase}
.cc2{margin-top:6px;font-size:17px;color:#555}
.aufbanner{display:flex;align-items:center;gap:14px;background:#f4bd00;color:#000;border-radius:14px;padding:16px 18px;box-shadow:0 1px 2px rgba(0,0,0,.06),0 6px 18px rgba(244,189,0,.25)}
.aufb-h{font-family:var(--head);font-weight:600;font-size:17px;letter-spacing:3px;line-height:1.1}
.aufb-s{margin-top:4px;font-size:15px;line-height:1.3}
.aufpill{align-self:flex-start;display:inline-flex;align-items:center;gap:7px;background:#f4bd00;color:#000;border-radius:999px;padding:6px 13px 6px 9px;font-size:15px;margin-top:4px}
.aufpill b{font-weight:400;letter-spacing:.5px}
.status .txt .aufpill{margin-top:8px}
.aufline{display:flex;align-items:center;gap:8px;font-size:15px;padding-top:10px;border-top:1px solid rgba(0,0,0,.1)}
.aufline b{font-weight:400;letter-spacing:2px;text-transform:uppercase;font-size:13px}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
/* ============================================================
   Saunaplan App (WordPress-Kunden-App)
   Daten kommen live aus der Google-Tabelle ueber Apps Script.
   Ansichten: #  (Uebersicht) | #sanarium | #sanarium-woche | #finnisch
   ============================================================ */
const DATA_URL = "https://script.google.com/macros/s/AKfycbwi6oI96_qHr6GsFBUZ0OCP2KTLpHeZ8Q3iMpwGs2W6LeKBrmrMP1vsK9nfK_aiI3YYEQ/exec?format=alle";
const DATA_REFRESH_MS = 5 * 60 * 1000;
const RETRY_MS = 30 * 1000;
const UI_REFRESH_MS = 30 * 1000;
const CACHE_KEY = "saunaplan-app-cache";
const TIMEZONE = "Europe/Vienna";

const WEEK = ["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];
const SPECS = { sanarium:{ temp:55, hum:50 }, finnisch:{ temp:85, hum:10 } };

/* ---------- Icons ---------- */
function personIcon(c,w,h){return `<svg viewBox="0 0 40 64" width="${w}" height="${h}" fill="none"><circle cx="20" cy="10" r="9" stroke="${c}" stroke-width="3"/><path d="M6 60 L10 28 Q20 20 30 28 L34 60" stroke="${c}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/></svg>`;}
function mixedIcon(c,w,h){return `<svg viewBox="0 0 76 64" width="${w}" height="${h}" fill="none"><circle cx="18" cy="10" r="8" stroke="${c}" stroke-width="3"/><path d="M6 58 L9 26 Q18 19 27 26 L30 58" stroke="${c}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="58" cy="10" r="8" stroke="${c}" stroke-width="3"/><path d="M50 30 L46 44 L52 44 L52 58 L64 58 L64 44 L70 44 L66 30 Z" stroke="${c}" stroke-width="3" stroke-linejoin="round"/></svg>`;}
function cleaningIcon(c,w,h){return `<svg viewBox="0 0 64 64" width="${w}" height="${h}" fill="none"><rect x="18" y="27" width="21" height="33" rx="4" stroke="${c}" stroke-width="3"/><rect x="24" y="18" width="9" height="10" stroke="${c}" stroke-width="3"/><path d="M33 21 L46 21 L46 12 L37 12" stroke="${c}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;}
function thermoIcon(c){return `<svg viewBox="0 0 24 24" width="18" height="18" fill="none"><path d="M12 3a2 2 0 0 0-2 2v9.17a4 4 0 1 0 4 0V5a2 2 0 0 0-2-2z" stroke="${c}" stroke-width="1.6"/><circle cx="12" cy="18" r="2.4" fill="${c}"/></svg>`;}
function dropIcon(c){return `<svg viewBox="0 0 24 24" width="18" height="18" fill="none"><path d="M12 2C12 2 5 11 5 15.5A7 7 0 0 0 19 15.5C19 11 12 2 12 2Z" stroke="${c}" stroke-width="1.6"/></svg>`;}
function arrowIcon(c){return `<svg viewBox="0 0 120 80" width="30" height="20" fill="none" aria-hidden="true"><path d="M6 40 H96" stroke="${c}" stroke-width="11" stroke-linecap="round"/><path d="M66 10 L100 40 L66 70" stroke="${c}" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/></svg>`;}

/* ---------- Helfer ---------- */
function esc(s){return String(s).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));}
function toMin(hhmm){const [h,m]=hhmm.split(":").map(Number);return h*60+m;}
function now(){
  const parts=new Intl.DateTimeFormat("de-DE",{timeZone:TIMEZONE,weekday:"long",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date());
  const p={};parts.forEach(x=>p[x.type]=x.value);
  const hour=parseInt(p.hour,10)%24;
  return {weekday:p.weekday, minutes:hour*60+parseInt(p.minute,10), clock:String(hour).padStart(2,"0")+":"+p.minute};
}
function kind(bereich){
  const b=String(bereich||"").toLowerCase();
  if(b.includes("reinigung")) return "clean";
  if(b.startsWith("ladies")) return "ladies";
  return "mixed";
}
function specsFor(bereich){
  const b=String(bereich||"").toLowerCase();
  if(b.includes("reinigung")) return null;
  if(b.includes("finnisch")) return SPECS.finnisch;
  if(b.includes("sanarium")) return SPECS.sanarium;
  return null;
}
function rowIcon(bereich,big){
  const k=kind(bereich);
  if(k==="clean") return cleaningIcon("#5a5b59",big?34:26,big?34:26);
  if(k==="ladies") return personIcon("#ef5b84",big?22:18,big?34:28);
  return mixedIcon("#000000",big?40:32,big?34:27);
}
function daysOf(plan,day){return (plan&&plan[day])||[];}
function findActive(rows,min){return rows.find(r=>min>=toMin(r.start)&&min<toMin(r.end))||null;}
function findNext(plan,day,min){
  const i=WEEK.indexOf(day);
  const later=daysOf(plan,day).find(r=>toMin(r.start)>min);
  if(later) return {day,row:later,today:true};
  for(let k=1;k<=7;k++){const d=WEEK[(i+k)%7];const rows=daysOf(plan,d);if(rows.length) return {day:d,row:rows[0],today:false};}
  return null;
}

/* ---------- Status (Kachel + Kopf der Detailseiten) ---------- */
function isEmptyPlan(plan){return WEEK.every(d=>!daysOf(plan,d).length);}
function closedCard(name){return `<div class="closedcard"><div class="cc1">${name}</div><div class="cc2">ist derzeit geschlossen.</div></div>`;}
function statusInfo(plan,t){
  if(isEmptyPlan(plan)) return {active:null,foot:"Derzeit geschlossen"};
  const rows=daysOf(plan,t.weekday);
  const active=findActive(rows,t.minutes);
  if(active){
    const after=rows.find(r=>toMin(r.start)>=toMin(active.end));
    const foot=after ? "Danach "+after.start+" "+after.bereich : "Danach geschlossen";
    return {active,foot};
  }
  const next=findNext(plan,t.weekday,t.minutes);
  let foot="Kein Plan hinterlegt";
  if(next) foot="Nächste Einheit: "+(next.today?"heute":next.day)+" "+next.row.start+" Uhr";
  return {active:null,foot};
}
function statusBlock(info,withTag,iconSize,extra){
  const a=info.active;
  const W=iconSize||66, H=Math.round(W*64/76);
  if(!a){
    return `<div class="status"><div class="ico">${mixedIcon("rgba(0,0,0,.4)",W,H)}</div>
      <div class="txt">${withTag?'<span class="now-tag">JETZT</span>':''}<span class="big">GESCHLOSSEN</span>${withTag?`<div class="meta small"><span>${esc(info.foot)}</span></div>`:''}</div></div>`;
  }
  const k=kind(a.bereich);
  let icon, lines;
  if(k==="clean"){icon=cleaningIcon("#000000",Math.round(W*.8),Math.round(W*.8));lines=['REINIGUNG'];}
  else if(k==="ladies"){icon=personIcon("#ef5b84",Math.round(H*.62),H);}
  else {icon=mixedIcon("#000000",W,H);}
  if(!lines){const parts=a.bereich.split(" ");lines=[parts[0],parts.slice(1).join(" ")].filter(Boolean).map(s=>s.toUpperCase());}
  const cls=k==="ladies"?"big pink":"big";
  const txt=withTag
    ? `<span class="${cls}" style="font-size:28px">${esc(lines.join(" "))}</span>`
    : lines.map(l=>`<span class="${cls}">${esc(l)}</span>`).join("");
  return `<div class="status"><div class="ico">${icon}</div><div class="txt">${withTag?'<span class="now-tag">JETZT</span>':''}${txt}${extra||''}</div></div>`;
}
function metaLine(info,small){
  const a=info.active; if(!a) return "";
  const s=specsFor(a.bereich);
  return `<div class="meta${small?" small":""}"><span class="time">${a.start} – ${a.end}</span>${s?`<span>${thermoIcon("#000000")}${s.temp} °C</span><span>${dropIcon("#000000")}${s.hum} %</span>`:""}</div>`;
}

/* ---------- Automatischer Aufguss: alle 30 Minuten (volle und halbe Stunde) ---------- */
function steamIcon(c,w){return `<svg viewBox="0 0 24 24" width="${w||22}" height="${w||22}" fill="none" aria-hidden="true"><path d="M7 21c-2-3 2-5 0-8s2-5 0-8" stroke="${c||"#000"}" stroke-width="1.8" stroke-linecap="round"/><path d="M12 21c-2-3 2-5 0-8s2-5 0-8" stroke="${c||"#000"}" stroke-width="1.8" stroke-linecap="round"/><path d="M17 21c-2-3 2-5 0-8s2-5 0-8" stroke="${c||"#000"}" stroke-width="1.8" stroke-linecap="round"/></svg>`;}
function hhmm(m){return String(Math.floor(m/60)%24).padStart(2,"0")+":"+String(m%60).padStart(2,"0");}
function nextAufguss(plan,t){
  const rows=daysOf(plan,t.weekday).filter(r=>kind(r.bereich)!=="clean");
  for(let c=Math.ceil(t.minutes/30)*30;c<24*60;c+=30){
    if(rows.some(r=>c>=toMin(r.start)&&c<toMin(r.end))) return c;
  }
  return null;
}
function aufgussPill(plan,t){
  const c=nextAufguss(plan,t); if(c===null) return "";
  const diff=c-t.minutes;
  const txt = diff===0 ? "Aufguss <b>jetzt</b>" : diff<=10 ? `Nächster Aufguss <b>in ${diff} Min</b> · ${hhmm(c)}` : `Nächster Aufguss <b>${hhmm(c)}</b>`;
  return `<div class="aufpill">${steamIcon("#000",20)}<span>${txt}</span></div>`;
}
const AUFGUSS_BANNER=`<div class="aufbanner">${steamIcon("#000",34)}<div class="aufb-t"><div class="aufb-h">AUTOMATISCHER AUFGUSS</div><div class="aufb-s">alle 30 Minuten · zur vollen und halben Stunde · in beiden Saunen</div></div></div>`;

/* ---------- Ansichten ---------- */
function viewHome(data,t){
  const tile=(href,label,plan,aria,cap)=>{
    const info=statusInfo(plan,t);
    return `<a class="tile" href="${href}" aria-label="${aria}">
      <div class="tile-top"><span class="tl"><span class="tile-label">${label}</span><span class="cap">${cap}</span></span>${arrowIcon("#1f1f1f")}</div>
      ${statusBlock(info,false)}
      ${metaLine(info)}
      ${aufgussPill(plan,t)}
      <div class="foot">${esc(info.foot)}</div></a>`;
  };
  return `<header class="top">
      <div class="brand"><span class="logo">sportssupport</span><span class="claim">FEEL THE HEAT</span></div>
      <div class="h-bold" style="margin-top:30px;font-size:50px;letter-spacing:3px;line-height:1">SAUNAPLAN</div>
      <div class="bar"></div>
      <div class="datetime">${t.weekday.toUpperCase()}, ${t.clock} UHR</div>
    </header>
    <main style="gap:16px">
      ${AUFGUSS_BANNER}
      ${tile("#sanarium","SAUNA COZY",data.sanarium,"Sauna Cozy öffnen","max. 8 Personen")}
      ${tile("#finnisch","SAUNA VIEW",data.finnisch,"Sauna View öffnen","max. 14 Personen")}
    </main>`;
}
function detailHead(titleHtml,tabs,info,pill){
  return `<header class="top">
    <a class="back" href="#">‹ ÜBERSICHT</a>
    ${titleHtml}
    ${tabs||""}
    ${info?`<div style="margin-top:26px">${statusBlock(info,true,76,metaLine(info,true)+(pill||""))}</div>`:""}
  </header>`;
}
function sanariumTabs(which){
  return `<nav class="tabs"><a href="#sanarium" class="${which==="heute"?"on":""}"${which==="heute"?' aria-current="page"':""}>HEUTE</a><a href="#sanarium-woche" class="${which==="woche"?"on":""}"${which==="woche"?' aria-current="page"':""}>WOCHE</a></nav>`;
}
const SAN_TITLE=`<div class="h-bold" style="margin-top:12px;font-size:36px;letter-spacing:3px">SAUNA COZY</div><div class="hcap">max. 8 Personen</div>`;
function viewSanariumHeute(data,t){
  const rows=daysOf(data.sanarium,t.weekday);
  const active=findActive(rows,t.minutes);
  const list=rows.length ? rows.map(r=>{
    const past=t.minutes>=toMin(r.end), on=r===active;
    return `<div class="row${on?" active":past?" past":""}${kind(r.bereich)==="clean"?" clean":""}"><div class="ico">${rowIcon(r.bereich,true)}</div><span class="t">${r.start} – ${r.end}</span><span class="a">${esc(r.bereich)}</span>${on?'<span class="tag">JETZT</span>':""}</div>`;
  }).join("") : `<div class="empty">Heute kein Plan hinterlegt</div>`;
  return detailHead(SAN_TITLE,sanariumTabs("heute"),statusInfo(data.sanarium,t),aufgussPill(data.sanarium,t)) +
    `<main style="gap:0;padding-top:20px">${AUFGUSS_BANNER}<div class="kicker" style="margin-top:22px">Heute, ${esc(t.weekday)}</div><div class="title" style="margin-top:6px">TAGESPLAN</div><div style="margin-top:14px">${list}</div></main>`;
}
function weekBlocks(plan,t,dotMode){
  return WEEK.map(d=>{
    const rows=daysOf(plan,d);
    const body=rows.length ? rows.map(r=>{
      const k=kind(r.bereich);
      const mark = dotMode
        ? `<span class="dot" style="background:${k==="ladies"?"#ef5b84":k==="clean"?"#868785":"#000"}"></span>`
        : `<div class="ico">${rowIcon(r.bereich,false)}</div>`;
      return `<div class="drow">${mark}<span class="t">${r.start} – ${r.end}</span><span class="a">${esc(r.bereich)}</span></div>`;
    }).join("") : `<div class="drow"><span class="a" style="color:#4a4b49">Geschlossen</span></div>`;
    const today=d===t.weekday;
    return `<section class="day${today?" today":""}"><div class="day-head"><span>${d.toUpperCase()}</span>${today?'<span class="tag">HEUTE</span>':""}</div>${body}</section>`;
  }).join("");
}
function specLine(name,s){
  return `<div class="spec"><b>${name}</b><span>${thermoIcon("#000")}${s.temp} °C</span><span>${dropIcon("#000")}${s.hum} %</span></div>`;
}
function viewSanariumWoche(data,t){
  return detailHead(SAN_TITLE,sanariumTabs("woche"),null) +
    `<main><div class="legend"><div class="keys">
      <span><span class="dot" style="background:#ef5b84"></span>Ladies</span>
      <span><span class="dot" style="background:#000"></span>Mixed</span>
      <span><span class="dot" style="background:#868785"></span>Reinigung</span></div><hr>
      ${specLine("SANARIUM",SPECS.sanarium)}${specLine("FINNISCH",SPECS.finnisch)}<div class="aufline">${steamIcon("#000",20)}<span><b>Aufguss</b> automatisch alle 30 Min · zur vollen &amp; halben Stunde</span></div></div>
      ${isEmptyPlan(data.sanarium)?closedCard("Die Sauna Cozy"):weekBlocks(data.sanarium,t,true)}</main>`;
}
function viewFinnisch(data,t){
  const title=`<div class="h-bold" style="margin-top:12px;font-size:36px;letter-spacing:3px">SAUNA VIEW</div><div class="hcap">max. 14 Personen</div>`;
  return detailHead(title,"",statusInfo(data.finnisch,t),aufgussPill(data.finnisch,t)) +
    `<main>${isEmptyPlan(data.finnisch)?"":`<div class="legend"><div class="keys">
      <span>${mixedIcon("#000",26,22)}Mixed Finnisch</span>
      <span>${cleaningIcon("#5a5b59",22,22)}Reinigung</span></div><hr>
      ${specLine("FINNISCH",SPECS.finnisch)}<div class="aufline">${steamIcon("#000",20)}<span><b>Aufguss</b> automatisch alle 30 Min · zur vollen &amp; halben Stunde</span></div></div>`}
      ${isEmptyPlan(data.finnisch)?closedCard("Die Sauna View"):weekBlocks(data.finnisch,t,false)}</main>`;
}

/* ---------- Platzhalter, solange der Plan das erste Mal geladen wird ---------- */
function sk(w,h,extra){return `<div class="sk" style="width:${w};height:${h}px;${extra||""}"></div>`;}
function viewSkeleton(route,t){
  if(route.startsWith("sanarium")||route==="finnisch"){
    const title = route==="finnisch"
      ? `<div class="h-bold" style="margin-top:12px;font-size:36px;letter-spacing:3px">SAUNA VIEW</div><div class="hcap">max. 14 Personen</div>`
      : SAN_TITLE;
    return detailHead(title,"",null)+`<main>${[1,2,3,4].map(()=>`<div class="row" style="gap:14px">${sk("40px",34)}${sk("100px",18)}${sk("40%",18)}</div>`).join("")}</main>`;
  }
  const tile=(label,cap)=>`<div class="tile"><div class="tile-top"><span class="tl"><span class="tile-label">${label}</span><span class="cap">${cap}</span></span>${arrowIcon("#1f1f1f")}</div>
      <div class="status">${sk("66px",56,"border-radius:12px")}<div class="txt" style="flex:1;gap:10px">${sk("70%",26)}${sk("55%",26)}</div></div>
      ${sk("80%",20)}<div class="foot">${sk("60%",14)}</div></div>`;
  return `<header class="top">
      <div class="brand"><span class="logo">sportssupport</span><span class="claim">FEEL THE HEAT</span></div>
      <div class="h-bold" style="margin-top:30px;font-size:50px;letter-spacing:3px;line-height:1">SAUNAPLAN</div>
      <div class="bar"></div>
      <div class="datetime">${t.weekday.toUpperCase()}, ${t.clock} UHR</div>
    </header>
    <main style="gap:16px">${tile("SAUNA COZY","max. 8 Personen")}${tile("SAUNA VIEW","max. 14 Personen")}</main>`;
}

/* ---------- Steuerung ---------- */
let DATA=null;
function readCache(){try{const d=JSON.parse(localStorage.getItem(CACHE_KEY)||"null");return d&&d.sanarium?d:null;}catch(e){return null;}}
function writeCache(d){try{localStorage.setItem(CACHE_KEY,JSON.stringify(d));}catch(e){}}

let lastRoute=null;
function render(){
  const t=now();
  const route=(location.hash||"#").slice(1);
  if(!DATA){ document.getElementById("app").innerHTML=viewSkeleton(route,t); return; }
  const views={"":viewHome,"sanarium":viewSanariumHeute,"sanarium-woche":viewSanariumWoche,"finnisch":viewFinnisch};
  const view=views[route]||viewHome;
  document.getElementById("app").innerHTML=view(DATA,t);
  if(route!==lastRoute){window.scrollTo(0,0);lastRoute=route;}
}

let timer=null;
function load(){
  clearTimeout(timer);
  fetch(DATA_URL,{cache:"no-store"})
    .then(r=>{if(!r.ok) throw new Error("HTTP "+r.status);return r.json();})
    .then(d=>{
      if(!d||typeof d!=="object"||!d.sanarium) throw new Error("unerwartete Daten");
      d.finnisch=d.finnisch||{};
      DATA=d;writeCache(d);render();
      timer=setTimeout(load,DATA_REFRESH_MS);
    })
    .catch(err=>{
      console.warn("Saunaplan konnte nicht geladen werden:",err);
      if(!DATA) document.getElementById("app").innerHTML='<div class="note">Saunaplan kann gerade nicht geladen werden.<br>Bitte später erneut öffnen.</div>';
      timer=setTimeout(load,RETRY_MS);
    });
}

DATA=readCache();
render();
load();
window.addEventListener("hashchange",render);
setInterval(render,UI_REFRESH_MS);
document.addEventListener("visibilitychange",()=>{if(!document.hidden) load();});
</script>
</body>
</html>
